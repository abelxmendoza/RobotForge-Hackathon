name: Deploy landing page to GitHub Pages

# Retired as the live deploy: the site is served from Vercel at the
# domain root (robot-forge-hackathon.vercel.app), and the Next build no
# longer carries the /RobotForge-Hackathon base path, so a Pages copy
# would load without its styles and images. Manual runs only, so one
# canonical URL is all a visitor (or a judge) can find.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-next/package-lock.json
      - name: Build the Next.js site (prebuild syncs catalog data from the repo)
        working-directory: web-next
        run: |
          npm ci
          npm run build
      - name: Keep the vanilla site alongside, under /vanilla/
        run: |
          mkdir -p web-next/out/vanilla
          cp index.html kit.html parts.html problem-space.html reports.html robodex.html try.html web-next/out/vanilla/
          cp -r app assets catalog examples web-next/out/vanilla/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-next/out
      - id: deployment
        uses: actions/deploy-pages@v4
