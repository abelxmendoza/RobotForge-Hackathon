name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Node 22 runs the Worker mock suite and the browser-port parity
      # tests (rover.ts / inventory.ts run with --experimental-strip-types).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-next/package-lock.json
      # The node unit tests (bom, palette, physics, wiring, build plan,
      # demo bar) symlink web-next/node_modules for zod / three / react.
      - name: Install web-next packages
        run: npm ci --prefix web-next
      - name: Install package + test runner
        run: pip install -e . pytest
      - name: Run the test suite
        run: python -m pytest tests/ -q
      - name: Build the production web export
        working-directory: web-next
        run: npm run build
      - name: Smoke-test required exported routes
        working-directory: web-next
        run: npm run smoke
