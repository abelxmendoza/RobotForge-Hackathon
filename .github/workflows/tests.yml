name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Node 22 runs the Worker mock suite and the browser-port parity
      # tests (rover.ts / inventory.ts run with --experimental-strip-types).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install package + test runner
        run: pip install -e . pytest
      - name: Run the test suite
        run: python -m pytest tests/ -q
