# RobotForge live endpoint — Cloudflare Worker configuration.
# Deploy walkthrough: live/README.md. The Worker code is worker.js in
# this folder; the Baseten key is a secret (wrangler secret put), it is
# never a value in this file.
name = "robotforge-live"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Guardrail defaults. These are plain vars, not secrets — raise or
# lower them here and redeploy. The Worker reads them per request.
[vars]
LIVE_ENABLED = "1"          # kill switch: "0" turns every live call away
DAILY_LIMIT = "450"         # global live calls per UTC day (KV counter).
                            # Raised from 200 for judging, Nov 4-9 2026
                            # (one demo click is 1-3 calls). Each call
                            # writes 2 KV keys, so 450 stays under KV's
                            # free 1,000 writes/day. Back to 200 after Nov 9.
PER_IP_DAILY_LIMIT = "30"   # live calls per visitor IP per UTC day

# Budget + rate-limit counters. Bound and live as of the 2026-10-28
# deploy (namespace created via the Cloudflare API; /health reports
# "kv": true). Keep this block in sync with the deployed binding —
# a wrangler deploy without it would unbind the counters.
[[kv_namespaces]]
binding = "RF_LIVE_KV"
id = "e998ad4b0f7f4f91b070ca79d640a348"
